<style>
/* ================= ФУНДАМЕНТ ================= */
:root{
  --r-lg:22px; --r-md:15px; --r-sm:11px;
  --spring:cubic-bezier(.32,1.35,.36,1);
  --ease:cubic-bezier(.25,.1,.25,1);
  --soft:cubic-bezier(.22,1,.3,1);
}
html[data-theme="dark"]{
  --bg:#0d0f12; --bg2:#13161a; --s1:#181c21; --s2:#20252c; --s3:#293039;
  --line:#262c34; --line2:#333b45;
  --ink:#eceef0; --dim:#98a0ab; --faint:#5f6772;
  --shadow-1:0 1px 2px rgba(0,0,0,.3),0 5px 16px rgba(0,0,0,.22);
  --shadow-2:0 3px 8px rgba(0,0,0,.35),0 14px 38px rgba(0,0,0,.3);
  --shadow-pop:0 10px 28px rgba(0,0,0,.45),0 28px 70px rgba(0,0,0,.4);
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f2f1ed; --bg2:#f9f8f5; --s1:#ffffff; --s2:#efedе8; --s2:#efede8; --s3:#e6e3dc;
  --line:#e1ded6; --line2:#d1cdc3;
  --ink:#22252a; --dim:#6a7076; --faint:#989ea6;
  --shadow-1:0 1px 2px rgba(45,40,30,.07),0 5px 16px rgba(45,40,30,.06);
  --shadow-2:0 3px 8px rgba(45,40,30,.09),0 14px 34px rgba(45,40,30,.09);
  --shadow-pop:0 10px 26px rgba(45,40,30,.14),0 26px 60px rgba(45,40,30,.12);
  color-scheme:light;
}
/* акценты */
html[data-accent="green"]{--acc:#59a877;--acc-deep:#3d8a5c;--acc-soft:#1c2f24;--acc-ink:#0c1a11}
html[data-accent="gold"]{--acc:#d0973f;--acc-deep:#a8761f;--acc-soft:#332a18;--acc-ink:#170f04}
html[data-accent="blue"]{--acc:#5c90da;--acc-deep:#3d6cb4;--acc-soft:#1a2636;--acc-ink:#0a1220}
html[data-accent="wine"]{--acc:#b75c6f;--acc-deep:#94404f;--acc-soft:#301c21;--acc-ink:#1a0c0f}
html[data-theme="light"][data-accent="green"]{--acc:#3d8a5c;--acc-deep:#2e6b46;--acc-soft:#ddeee4;--acc-ink:#fff}
html[data-theme="light"][data-accent="gold"]{--acc:#a8761f;--acc-deep:#8a5f14;--acc-soft:#f2e7d1;--acc-ink:#fff}
html[data-theme="light"][data-accent="blue"]{--acc:#3d6cb4;--acc-deep:#2d5391;--acc-soft:#dde7f4;--acc-ink:#fff}
html[data-theme="light"][data-accent="wine"]{--acc:#94404f;--acc-deep:#77303d;--acc-soft:#f0dde1;--acc-ink:#fff}

/* сферы */
html{--sp-earn:#e0a53c;--sp-study:#5f9df2;--sp-body:#4bb87d;--sp-faith:#b592ea;--sp-none:#78828f}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  font-size:15.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  position:fixed; inset:0;
  user-select:none;-webkit-user-select:none;
}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(1100px 640px at 50% -14%, var(--bg2), var(--bg))}
input,textarea{user-select:text;-webkit-user-select:text}

#shell{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1}
#topbar{flex-shrink:0;padding:calc(10px + env(safe-area-inset-top)) 16px 8px;
  display:flex;align-items:center;gap:10px}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;position:relative}
.inner{max-width:760px;margin:0 auto;padding:0 12px 40px}

/* ================= ШАПКА ================= */
.htitle{flex:1;min-width:0}
.hdow{font-size:12px;color:var(--faint);text-transform:capitalize;letter-spacing:.04em}
.hdate{font-size:21px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.hdate .acc{color:var(--acc)}
.navbtn{
  width:42px;height:42px;border-radius:13px;background:var(--s1);border:1px solid var(--line);
  color:var(--dim);font-size:17px;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-1);cursor:pointer;
  transition:transform .16s var(--spring),color .2s,background .2s;
}
.navbtn:active{transform:scale(.9)}
.todaychip{
  font-size:13px;color:var(--acc);background:var(--acc-soft);border-radius:20px;
  padding:9px 16px;border:none;font-weight:650;cursor:pointer;
  animation:chipin .35s var(--spring);
  transition:transform .16s var(--spring);
}
.todaychip:active{transform:scale(.92)}
@keyframes chipin{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}

/* ================= ОСЬ ДНЯ ================= */
/* сегменты масштаба */
#segwrap{flex-shrink:0;display:flex;justify-content:center;padding:2px 14px 8px}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:12px;
  padding:3px;box-shadow:var(--shadow-1)}
.seg button{background:transparent;color:var(--dim);border:none;border-radius:9px;
  padding:9px 18px;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;
  transition:color .2s,background .3s var(--ease)}
.seg button.on{background:var(--s3);color:var(--ink);box-shadow:var(--shadow-1)}

/* НЕДЕЛЯ */
.wk{display:grid;grid-template-columns:30px repeat(7,1fr);position:relative;margin-top:4px}
.wkhh{position:relative}
.wkhl{position:absolute;right:5px;font-size:9.5px;color:var(--faint);
  transform:translateY(-50%);font-variant-numeric:tabular-nums}
.wkcol{position:relative;border-left:1px solid var(--line)}
.wkcol.we{background:color-mix(in srgb,var(--s1) 45%,transparent)}
.wkline{position:absolute;left:30px;right:0;border-top:1px solid var(--line);opacity:.5;pointer-events:none}
.wkhead{position:sticky;top:0;z-index:6;background:var(--bg);
  text-align:center;padding:5px 0 6px;cursor:pointer;border-bottom:1px solid var(--line)}
.wkhead .wl{font-size:9.5px;color:var(--faint);text-transform:uppercase}
.wkhead .wn{font-size:14px;font-weight:650;
  width:26px;height:26px;line-height:26px;border-radius:50%;margin:2px auto 0}
.wkhead.now .wn{background:var(--acc);color:var(--acc-ink)}
.wkhead.now .wl{color:var(--acc)}
.wblk{position:absolute;left:2px;right:2px;border-radius:6px;overflow:hidden;cursor:pointer;
  background:color-mix(in srgb,var(--sc,#888) 30%,var(--s1));
  border-left:3px solid var(--sc,#888);padding:2.5px 5px;
  font-size:10.5px;font-weight:550;line-height:1.25;color:var(--ink);
  overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto;
  transition:filter .2s}
.wblk:active{filter:brightness(1.15)}
.wblk .wbt{font-size:9px;font-weight:400;color:var(--dim);font-variant-numeric:tabular-nums}
.wknow{position:absolute;height:0;border-top:1.5px solid var(--acc);z-index:5;pointer-events:none;left:0;right:0}

/* МЕСЯЦ — полотно, как у Apple */
.mo{margin-top:0}
.mohead{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px;
  position:sticky;top:0;z-index:7;background:var(--bg);padding:4px 0 5px}
.mohead div{text-align:center;font-size:10.5px;color:var(--faint);text-transform:uppercase}
.mofh{font-size:26px;font-weight:700;letter-spacing:-.02em;padding:26px 2px 10px;text-transform:capitalize}
.mofh:first-child{padding-top:6px}
.mofh .mfy{font-size:15px;color:var(--faint);font-weight:600;margin-left:8px}
.mofh.curm{color:var(--acc)}
.morow{position:relative;border-top:1px solid var(--line);padding:6px 0 13px;min-height:calc((100vh - 260px) / 6)}
.morow .wnum{position:absolute;left:0;top:-8px;font-size:10px;color:var(--faint);
  background:var(--bg);padding-right:6px;font-variant-numeric:tabular-nums}
.morow.cur .wnum{color:var(--acc)}
.mogrid7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;align-items:start}
.mocell{min-width:0;cursor:pointer;padding:2px 1.5px;border-radius:8px;
  display:flex;flex-direction:column;gap:3px;height:100%;min-height:56px;
  transition:background .2s,transform .16s var(--spring)}
.mocell:active{transform:scale(.96);background:var(--s1)}
.mocell.out{opacity:.35}
.mocell .mnum{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;
  text-align:center;width:30px;height:30px;line-height:30px;border-radius:50%;margin:0 auto}
.mocell.now .mnum{background:var(--acc);color:var(--acc-ink);font-weight:700}
.mpill{font-size:10.5px;font-weight:600;padding:2.5px 5px;border-radius:5.5px;
  background:color-mix(in srgb,var(--sc,#888) 30%,var(--bg));
  color:color-mix(in srgb,var(--sc,#888) 62%,var(--ink));
  overflow:hidden;min-width:0;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow-wrap:break-word}
.mpill .mpt{display:block;font-size:9px;font-weight:500;opacity:.75;font-variant-numeric:tabular-nums}
.mpill.past{opacity:.45}
.mmore{font-size:9.5px;color:var(--faint);padding-left:3px}
@media(min-width:980px){
  .mocell{min-height:98px}
  .mpill{font-size:11px}
}
@media(min-width:980px){.mocell{aspect-ratio:1.3}}

/* ГОД — тепловая карта */
.yr{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:6px;padding-bottom:20px}
@media(max-width:640px){.yr{grid-template-columns:repeat(2,1fr);gap:13px}}
@media(min-width:980px){.yr{grid-template-columns:repeat(4,1fr)}}
.ymon{cursor:pointer;border-radius:14px;padding:10px 11px;background:var(--s1);
  border:1px solid var(--line);box-shadow:var(--shadow-1);
  transition:transform .16s var(--spring),border-color .25s}
.ymon:active{transform:scale(.96)}
.ymon.cur{border-color:var(--acc)}
.ymon .ymt{font-size:12.5px;font-weight:650;margin-bottom:7px;text-transform:capitalize}
.ymon.cur .ymt{color:var(--acc)}
.ymgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.yd{aspect-ratio:1;border-radius:3px;background:var(--s2);position:relative;min-width:0}
.yd.h1{background:color-mix(in srgb,var(--acc) 22%,var(--s2))}
.yd.h2{background:color-mix(in srgb,var(--acc) 45%,var(--s2))}
.yd.h3{background:color-mix(in srgb,var(--acc) 72%,var(--s2))}
.yd.tod{outline:1.5px solid var(--acc);outline-offset:1px}
.yd.off{opacity:0}

/* полоса дней недели */
#dowbar{flex-shrink:0;display:flex;gap:4px;padding:4px 12px 10px;max-width:760px;margin:0 auto;width:100%}
.dcell{flex:1;text-align:center;padding:9px 0 10px;border-radius:12px;cursor:pointer;
  transition:background .2s,transform .16s var(--spring)}
.dcell:active{transform:scale(.92)}
.dcell .dl{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.dcell .dn{font-size:15px;font-weight:600;margin-top:2px;width:30px;height:30px;line-height:30px;
  border-radius:50%;margin-left:auto;margin-right:auto;
  transition:background .25s,color .25s}
.dcell.sel .dn{background:var(--s3);color:var(--ink)}
.dcell.now .dn{background:var(--acc);color:var(--acc-ink);font-weight:700}
.dcell.now .dl{color:var(--acc)}

/* сайдбар (десктоп) */
#sidebar{display:none}
@media(min-width:980px){
  .inner{max-width:1280px;display:grid;grid-template-columns:270px 1fr;gap:28px;align-items:start}
  #sidebar{display:block;position:sticky;top:6px}
  #dowbar{max-width:1280px;padding-left:310px}
  .dayfoot,.mobproj{display:none}
}
@media(min-width:1400px){
  .inner{max-width:1440px}
  #dowbar{max-width:1440px}
}
.mini{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);padding:14px 15px;margin-bottom:14px}
.mini .mhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mini .mtitle{flex:1;font-size:14px;font-weight:650;text-transform:capitalize}
.mini .mnav{width:27px;height:27px;border-radius:9px;background:var(--s2);border:1px solid var(--line);
  color:var(--dim);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .16s var(--spring)}
.mini .mnav:active{transform:scale(.88)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mgrid .mdl{font-size:10px;color:var(--faint);padding:3px 0;text-transform:uppercase}
.mgrid .md{font-size:12.5px;padding:0;height:30px;line-height:30px;border-radius:9px;cursor:pointer;
  color:var(--ink);transition:background .2s}
.mgrid .md.out{color:var(--faint);opacity:.5}
.mgrid .md.sel{background:var(--s3);font-weight:650}
.mgrid .md.now{background:var(--acc);color:var(--acc-ink);font-weight:700}
.mgrid .md.dotd::after{content:"";display:block;width:4px;height:4px;border-radius:50%;
  background:var(--acc);margin:-7px auto 0}
.sidefoot{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);padding:13px 15px}
.sidefoot .sft{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin-bottom:9px}
.sidefoot .srow{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13.5px}
.sidefoot .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--dc,#888) 22%,transparent)}
.sidefoot .fh{margin-left:auto;color:var(--dim);font-weight:600;font-variant-numeric:tabular-nums}
.sidefoot .sempty{color:var(--faint);font-size:12.5px}

/* проекты */
.pwrap{margin-top:18px}
.pht{display:flex;align-items:center;font-size:11px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--faint);margin-bottom:9px}
.padd{margin-left:auto;font-size:12px;color:var(--acc);cursor:pointer;letter-spacing:0;
  text-transform:none;font-weight:600;transition:transform .16s var(--spring);display:inline-block}
.padd:active{transform:scale(.92)}
.pcard{display:flex;align-items:center;gap:11px;background:var(--s1);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-1);
  padding:12px 14px;margin-bottom:9px;cursor:pointer;
  transition:transform .16s var(--spring),border-color .25s}
.pcard:active{transform:scale(.985)}
.pcard .picon{font-size:17px;width:34px;height:34px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--pc,#888) 20%,var(--s2));
  border:1px solid color-mix(in srgb,var(--pc,#888) 40%,var(--line))}
.pcard .pinfo{flex:1;min-width:0}
.pcard .pname{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .pmeta{font-size:11.5px;color:var(--dim);margin-top:1px;font-variant-numeric:tabular-nums}
.pcard .pmeta .warn{color:#d98a4a;font-weight:650}
.pcard .pmeta .over{color:#c05a50;font-weight:650}
.pcard.fin{opacity:.55}
.g5{margin-top:16px;font-size:13px;color:var(--dim);animation:gup .85s .5s var(--ease) both}
.g5 .gc{display:inline-block;margin:0 7px;font-variant-numeric:tabular-nums}
.g5 .gc b{color:var(--acc);font-weight:650}

/* дела дня — задачник */
.todobox{margin-top:16px;background:var(--s1);border:1px solid var(--line);border-radius:15px;
  box-shadow:var(--shadow-1);padding:13px 15px}
.todobox .tdt{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);
  margin-bottom:8px;display:flex;align-items:center;gap:8px}
.todobox .tdt .tdn{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--dim);letter-spacing:0}
.todobox .tdt .tdmgr{margin-left:auto;color:var(--faint);cursor:pointer;font-size:13px;letter-spacing:0}
.habline{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);
  animation:stepsin .3s var(--ease) both}
.habline .hlchk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:11px;cursor:pointer;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.15);
  transition:background .4s var(--ease),border-color .4s,color .4s,transform .2s var(--spring)}
.habline .hlchk:active{transform:scale(.85)}
.habline .hlchk.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);
  box-shadow:0 2px 9px color-mix(in srgb,var(--acc) 40%,transparent)}
.habline .hltx{flex:1;min-width:0;font-size:14px;color:var(--dim);
  transition:color .4s}
.habline .hltx.on{color:var(--faint)}
.habline .hl7{display:flex;gap:2.5px;flex-shrink:0}
.habline .hld{width:5px;height:5px;border-radius:1.5px;background:var(--line2)}
.habline .hld.f{background:var(--acc)}
.habsub{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
  margin-top:12px;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.habsub .hsmgr{margin-left:auto;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--faint)}
.trow2{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);
  animation:stepsin .3s var(--ease) both}
.trow2:last-of-type{border-bottom:none}
.trow2 .t2chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:11px;cursor:pointer;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.15);
  transition:background .4s var(--ease),border-color .4s,color .4s,transform .2s var(--spring)}
.trow2 .t2chk:active{transform:scale(.85)}
.trow2 .t2chk.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);
  box-shadow:0 2px 9px color-mix(in srgb,var(--acc) 40%,transparent)}
.trow2 .t2tx{flex:1;min-width:0;font-size:14.5px;overflow-wrap:break-word;
  text-decoration:line-through;text-decoration-color:transparent;
  transition:color .5s var(--ease),text-decoration-color .5s var(--ease)}
.trow2 .t2tx.don{color:var(--faint);text-decoration-color:var(--faint)}
.trow2 .t2put{font-size:11.5px;color:var(--acc);font-weight:600;cursor:pointer;white-space:nowrap;
  padding:6px 10px;border-radius:9px;background:var(--acc-soft);transition:transform .16s var(--spring)}
.trow2 .t2put:active{transform:scale(.92)}
.trow2 .t2del{color:var(--faint);padding:6px 9px;cursor:pointer;font-size:13px}
@media(min-width:980px){
  #sidebar .todobox{position:sticky;top:6px}
}

/* узлы закрытия дня/недели */
.closecard{margin-top:16px;display:flex;align-items:center;gap:12px;cursor:pointer;
  background:var(--s1);border:1px solid var(--line);border-radius:15px;
  padding:13px 15px;box-shadow:var(--shadow-1);
  transition:transform .16s var(--spring),border-color .3s}
.closecard:active{transform:scale(.98)}
.closecard .cicon{font-size:17px;width:36px;height:36px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;background:var(--acc-soft);color:var(--acc)}
.closecard .cbody{flex:1;min-width:0}
.closecard .ct{font-size:14px;font-weight:650}
.closecard .cs{font-size:12px;color:var(--dim);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.closecard.ok{border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.closecard.ok .ct{color:var(--acc)}
.moodrow{display:flex;gap:11px;margin-top:6px}
.mood{width:38px;height:38px;border-radius:50%;background:var(--s2);border:1.4px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;
  filter:grayscale(1) opacity(.55);
  transition:transform .18s var(--spring),filter .3s,border-color .3s}
.mood:active{transform:scale(.88)}
.mood.on{filter:none;border-color:var(--acc);transform:scale(1.08);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.sumrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
.sumchip{font-size:12.5px;color:var(--dim);background:var(--s2);border-radius:10px;
  padding:6px 11px;font-variant-numeric:tabular-nums}
.sumchip b{color:var(--ink);font-weight:650}

/* фоновые привычки — лента над днём */
.habbar{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.habbar::-webkit-scrollbar{display:none}
.hab{flex-shrink:0;display:flex;align-items:center;gap:8px;cursor:pointer;
  background:var(--s1);border:1px solid var(--line);border-radius:20px;
  padding:7px 13px;font-size:13px;font-weight:550;color:var(--dim);
  box-shadow:var(--shadow-1);
  transition:transform .16s var(--spring),background .3s var(--ease),color .3s,border-color .3s}
.hab:active{transform:scale(.93)}
.hab.on{background:var(--acc-soft);color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.hab .hchk{width:16px;height:16px;border-radius:50%;border:1.4px solid var(--line2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent;
  transition:background .35s var(--ease),border-color .35s,color .35s}
.hab.on .hchk{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.hab .hd7{display:flex;gap:2.5px;margin-left:1px}
.hab .hd{width:4px;height:4px;border-radius:50%;background:var(--line2)}
.hab .hd.f{background:var(--acc)}
.hab.mgr{color:var(--faint);font-weight:600;padding:7px 12px}
@keyframes habpop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.hab.pop{animation:habpop .5s var(--spring)}
@keyframes chkin{from{transform:scale(.2) rotate(-60deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.hab.on .hchk{animation:chkin .45s var(--spring)}
.hab .hd{transition:background .5s var(--ease),transform .3s var(--spring)}
.hab.pop .hd:last-child{transform:scale(1.5)}

#axiswrap{position:relative;touch-action:pan-y}
.axis{position:relative;margin-left:46px;margin-top:11px;border-left:1px solid var(--line)}
.hourline{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.55}
.hourlabel{position:absolute;left:-46px;width:39px;text-align:right;
  font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;
  transform:translateY(-50%);letter-spacing:.01em}

/* линия «сейчас» */
#nowline{position:absolute;left:-6px;right:0;height:0;border-top:1.5px solid var(--acc);
  z-index:5;pointer-events:none;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--acc) 55%,transparent))}
#nowline::before{content:"";position:absolute;left:-4px;top:-4.5px;width:8px;height:8px;
  border-radius:50%;background:var(--acc)}

/* блок */
.blk{
  position:absolute;border-radius:13px;overflow:hidden;cursor:pointer;
  background:color-mix(in srgb,var(--sc,#888) 21%,var(--s1));
  border:1px solid color-mix(in srgb,var(--sc,#888) 48%,var(--line));
  box-shadow:var(--shadow-1);
  transition:transform .18s var(--spring),box-shadow .25s var(--ease),filter .2s;
  min-width:0;
}
.blk:active{transform:scale(.985)}
.blk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--sc,#888);box-shadow:0 0 8px color-mix(in srgb,var(--sc,#888) 50%,transparent)}
.blk .bin{padding:8px 12px 8px 15px;height:100%;display:flex;flex-direction:column;gap:2px;min-width:0}
.blk .bt{font-size:14px;font-weight:600;line-height:1.3;flex-shrink:0;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.blk .bmeta{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;
  display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;flex-shrink:0}
.blk .bicon{font-size:12px}
.blk .btasks{margin-top:3px;display:flex;flex-direction:column;gap:1.5px;overflow:hidden}
.blk .bti{font-size:11px;line-height:1.3;color:var(--dim);display:flex;gap:5px;align-items:baseline;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk .bti .bdot{width:4px;height:4px;border-radius:50%;background:currentColor;flex-shrink:0;opacity:.7}
.blk .bti.d{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
.blk .bti.more{color:var(--faint);font-size:10px}
.blk .bcount{margin-left:auto;font-size:10.5px;color:var(--dim);
  background:color-mix(in srgb,var(--bg) 55%,transparent);padding:1px 7px;border-radius:8px}
.blk.short .bin{padding-top:4px;padding-bottom:4px;justify-content:center;gap:1px}
.blk.short .bt{-webkit-line-clamp:1;font-size:12.5px}
.blk.short .bmeta{display:none}
.blk.tiny .bin{padding:3px 8px 3px 12px;flex-direction:row;align-items:center;gap:7px}
.blk.tiny .bt{-webkit-line-clamp:1;font-size:12px}
.blk.tiny .bmeta{display:none}
.blk.done-all{filter:saturate(.55) opacity(.72)}
.blk.rit{background:color-mix(in srgb,var(--acc) 13%,var(--s1));
  border:1px dashed color-mix(in srgb,var(--acc) 50%,var(--line))}
.blk.rit::before{background:var(--acc);box-shadow:0 0 8px color-mix(in srgb,var(--acc) 45%,transparent)}
.blk.rit .bt{color:color-mix(in srgb,var(--acc) 70%,var(--ink))}
.blk.rit.ritdone{border-style:solid;filter:saturate(.6) opacity(.65)}
.blk.lifting{z-index:20;box-shadow:var(--shadow-pop),0 0 0 1.5px var(--sc,#888);
  transform:scale(1.015);transition:box-shadow .2s,transform .2s var(--spring)}
.blk .rz{position:absolute;left:0;right:0;bottom:0;height:15px;cursor:ns-resize;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.blk .rz::after{content:"";width:26px;height:3px;border-radius:2px;
  background:color-mix(in srgb,var(--sc,#888) 55%,transparent);opacity:0;transition:opacity .25s}
.blk:hover .rz::after,.blk.lifting .rz::after{opacity:1}

/* тап по пустому месту — призрак */
.ghost{position:absolute;left:6px;right:6px;border-radius:12px;border:1.5px dashed var(--line2);
  display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12.5px;
  animation:ghostin .25s var(--ease) both;pointer-events:none}
@keyframes ghostin{from{opacity:0}to{opacity:1}}

/* ================= КНОПКА + ================= */
#fab{
  position:fixed;right:20px;bottom:calc(26px + env(safe-area-inset-bottom));z-index:40;
  width:58px;height:58px;border-radius:20px;border:none;cursor:pointer;
  background:linear-gradient(150deg,var(--acc),var(--acc-deep));color:var(--acc-ink);
  font-size:26px;font-weight:300;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-2),0 6px 20px color-mix(in srgb,var(--acc) 40%,transparent);
  transition:transform .18s var(--spring),box-shadow .25s;
}
#fab:active{transform:scale(.9)}

/* ================= ПРИВЕТСТВИЕ ================= */
#greet{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:var(--bg);transition:opacity .65s var(--ease),visibility .65s}
#greet.gone{opacity:0;visibility:hidden;pointer-events:none}
.gbox{text-align:center;padding:0 32px;animation:gup .85s var(--ease) both}
@keyframes gup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.gbox .g1{font-size:31px;font-weight:700;letter-spacing:-.02em;line-height:1.2;
  background:linear-gradient(125deg,var(--ink) 25%,var(--acc));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.gbox .g2{margin-top:10px;color:var(--dim);font-size:14px}
.gbox .g3{margin-top:24px;color:var(--dim);font-size:16px;font-style:italic;line-height:1.5;
  animation:gup .85s .28s var(--ease) both}
.gbox .g4{margin-top:7px;color:var(--faint);font-size:12px;animation:gup .85s .38s var(--ease) both}

/* ================= ШТОРКА ================= */
.sheetwrap{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(5,6,8,0);pointer-events:none;
  transition:background .5s var(--ease),backdrop-filter .5s var(--ease),-webkit-backdrop-filter .5s var(--ease);
  backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px)}
.sheetwrap.show{background:rgba(5,6,8,.46);pointer-events:auto;
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.sheet{background:var(--s1);width:100%;max-width:640px;border-radius:26px 26px 0 0;
  border:1px solid var(--line);border-bottom:none;box-shadow:var(--shadow-pop);
  padding:16px 18px calc(26px + env(safe-area-inset-bottom));
  max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(103%);transition:transform .55s var(--soft);will-change:transform}
.sheetwrap.show .sheet{transform:translateY(0)}
.sheet > *{opacity:0;transform:translateY(9px);transition:opacity .4s var(--ease),transform .4s var(--ease)}
.sheetwrap.show .sheet > *{opacity:1;transform:none}
.sheetwrap.show .sheet > *:nth-child(1){transition-delay:.07s}
.sheetwrap.show .sheet > *:nth-child(2){transition-delay:.1s}
.sheetwrap.show .sheet > *:nth-child(3){transition-delay:.13s}
.sheetwrap.show .sheet > *:nth-child(4){transition-delay:.16s}
.sheetwrap.show .sheet > *:nth-child(5){transition-delay:.19s}
.sheetwrap.show .sheet > *:nth-child(6){transition-delay:.22s}
.sheetwrap.show .sheet > *:nth-child(7){transition-delay:.25s}
.sheetwrap.show .sheet > *:nth-child(8){transition-delay:.28s}
.sheetwrap.show .sheet > *:nth-child(9){transition-delay:.31s}
.sheetwrap.show .sheet > *:nth-child(10){transition-delay:.34s}
.grip{width:40px;height:4.5px;background:var(--line2);border-radius:3px;margin:0 auto 14px}

/* поля */
label{font-size:13px;color:var(--dim);display:block;margin:13px 0 5px}
input[type=text],input[type=time],textarea{
  font-family:inherit;font-size:16px;width:100%;
  background:var(--s2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:12px 13px;color:var(--ink);
  transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{outline:none;border-color:var(--acc);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
textarea{resize:none;min-height:60px;line-height:1.45}

button{font-family:inherit;cursor:pointer;border:none}
.btn{background:var(--s2);color:var(--ink);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:11px 15px;font-size:14px;font-weight:500;
  box-shadow:var(--shadow-1);
  transition:transform .16s var(--spring),box-shadow .22s,filter .2s}

.btn.primary{background:linear-gradient(150deg,var(--acc),var(--acc-deep));
  color:var(--acc-ink);font-weight:650;border:none}
.btn.wide{width:100%;padding:13.5px;font-size:15px;border-radius:var(--r-md)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--dim)}
.btn.sm{padding:9px 14px;font-size:13.5px}

/* чипы сфер/проектов */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
.chip{border-radius:11px;padding:9px 13px;font-size:13.5px;font-weight:550;
  background:var(--s2);color:var(--dim);border:1px solid var(--line);cursor:pointer;
  display:flex;align-items:center;gap:7px;
  transition:transform .16s var(--spring),background .22s,color .22s,box-shadow .22s}
.chip:active{transform:scale(.94)}
.chip .cd{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.chip.on{background:var(--s3);color:var(--ink);
  box-shadow:inset 0 0 0 1.5px var(--cc,var(--acc))}

/* дела внутри блока */
.tlist{margin-top:4px}
.titem{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.titem:last-child{border-bottom:none}
.tchk{width:23px;height:23px;border-radius:50%;border:1.5px solid var(--line2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:11px;
  cursor:pointer;box-shadow:inset 0 1px 3px rgba(0,0,0,.15);
  transition:background .45s var(--ease),border-color .45s var(--ease),color .45s var(--ease),transform .25s var(--spring)}
.tchk:active{transform:scale(.85)}
.tchk.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);
  box-shadow:0 2px 9px color-mix(in srgb,var(--acc) 40%,transparent)}
.ttx{flex:1;min-width:0;font-size:14.5px;
  text-decoration:line-through;text-decoration-color:transparent;text-decoration-thickness:1.4px;
  transition:color .5s var(--ease),text-decoration-color .5s var(--ease);
  overflow-wrap:break-word}
.ttx.don{color:var(--faint);text-decoration-color:var(--faint)}
.tdel{color:var(--faint);padding:8px 11px;cursor:pointer;font-size:14px;
  transition:color .2s,transform .16s var(--spring)}
.tdel:active{transform:scale(.9);color:var(--ink)}
.taddrow{display:flex;gap:8px;margin-top:9px}
.taddrow input{flex:1}

/* сводка дня под осью */
.dayfoot{margin:18px 0 0;display:flex;gap:9px;flex-wrap:wrap}
.dayfoot .fchip{display:flex;align-items:center;gap:8px;
  background:var(--s1);border:1px solid var(--line);border-radius:13px;
  padding:9px 14px;font-size:13.5px;font-weight:550;color:var(--ink);
  box-shadow:var(--shadow-1)}
.dayfoot .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--dc,#888) 22%,transparent)}
.dayfoot .fh{color:var(--dim);font-weight:600;font-variant-numeric:tabular-nums}
.dayfoot .empty{color:var(--faint);font-size:13px;font-weight:400;border-style:dashed;box-shadow:none}

@keyframes stepsin{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
#axiswrap.zin{animation:zoomin .42s var(--soft) both}
#axiswrap.zout{animation:zoomout .42s var(--soft) both}
@keyframes zoomin{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:scale(1)}}
@keyframes zoomout{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.peek{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(5,6,8,0);pointer-events:none;
  transition:background .35s var(--ease),backdrop-filter .35s var(--ease),-webkit-backdrop-filter .35s var(--ease);
  backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px)}
.peek.show{background:rgba(5,6,8,.4);pointer-events:auto;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.peekcard{background:var(--s1);border:1px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow-pop);width:100%;max-width:400px;max-height:70vh;overflow-y:auto;
  padding:18px;transform:scale(.9) translateY(10px);opacity:0;
  transition:transform .4s var(--spring),opacity .3s var(--ease)}
.peek.show .peekcard{transform:none;opacity:1}
.peekcard .pkh{display:flex;align-items:baseline;gap:9px;margin-bottom:14px}
.peekcard .pkdow{font-size:12px;color:var(--faint);text-transform:capitalize}
.peekcard .pkdate{font-size:19px;font-weight:700}
.peekcard .pkopen{margin-left:auto;font-size:12.5px;color:var(--acc);font-weight:600;cursor:pointer}
.peekrow{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.peekrow:last-child{border-bottom:none}
.peekrow .pkbar{width:3.5px;align-self:stretch;border-radius:2px;flex-shrink:0;background:var(--sc,#888)}
.peekrow .pktime{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;width:44px;flex-shrink:0;padding-top:1px}
.peekrow .pktitle{flex:1;min-width:0;font-size:14px;font-weight:550;line-height:1.35}
.peekempty{text-align:center;color:var(--faint);font-size:13.5px;padding:18px 0}
</style>
</head>
<body>
<div id="greet">
  <div class="gbox">
    <div class="g1" id="g-hello"></div>

</div>

<div id="shell">

<script>
"use strict";
/* ================= СОСТОЯНИЕ ================= */
const LS="calos1";
const DOW=["понедельник","вторник","среда","четверг","пятница","суббота","воскресенье"];
const MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const H0=0, H1=24;           // полный день, как в Apple
// HPX задан ниже
const HPX=52;                // базовый час (для снапа драга в живой зоне)
/* нелинейная шкала: ночь сжата, день развёрнут */
const ZONES=[[0,6,14],[6,24,52]]; // [отЧаса, доЧаса, пикселей/час]
function yOfMin(mins){ // минуты -> px
  let y=0;
  for(const [a,b,px] of ZONES){
    const lo=a*60, hi=b*60;
    if(mins<=lo) break;
    y+=(Math.min(mins,hi)-lo)/60*px;
    if(mins<=hi) break;
  }
  return y;
}
function minOfY(y){ // px -> минуты
  let acc=0;
  for(const [a,b,px] of ZONES){
    const zoneH=(b-a)*px;
    if(y<=acc+zoneH) return a*60+(y-acc)/px*60;
    acc+=zoneH;
  }
  return H1*60;
}
const AXIS_H=yOfMin(H1*60);
function pxPerHourAt(mins){
  for(const [a,b,px] of ZONES){ if(mins>=a*60&&mins<b*60) return px; }
  return 64;
}

function todayISO(){ return iso(new Date()); }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(i,n){ const d=new Date(i+"T12:00"); d.setDate(d.getDate()+n); return iso(d); }
function dowIdx(i){ return (new Date(i+"T12:00").getDay()+6)%7; }
function human(i){ const d=new Date(i+"T12:00"); return d.getDate()+" "+MON[d.getMonth()]; }
function m2t(m){ return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function t2m(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }

function seed(){
  return {
    settings:{ name:"Кирилл", theme:"dark", accent:"green" },
    spheres:[
      { id:"earn",  name:"Заработок", color:"var(--sp-earn)" },
      { id:"study", name:"Учёба",     color:"var(--sp-study)" },
      { id:"body",  name:"Тело",      color:"var(--sp-body)" },
      { id:"faith", name:"Вера",      color:"var(--sp-faith)" }
    ],
    projects:[],   // {id,name,icon}
    rituals:[
      { id:"morning", name:"Утренний ритуал", time:"07:30", dur:30,
        steps:["Стакан воды","Молитва и благодарность","Ревизия планов на день","Душ и гигиена","Порядок в комнате"], log:{} },
      { id:"evening", name:"Вечерний ритуал", time:"22:30", dur:30,
        steps:["Запись событий дня","Вещи и план на завтра","Душ","Молитва","Будильник и спать"], log:{} }
    ],
    habits:[],     // фоновые: {id,name,log:{iso:true}}
    weeks:{},      // mondayISO -> {note,intent}
    repeats:[],    // {id,title,start,end,sphereId,projectId,color,dows:[0..6],from,skip:{iso:true}}
    todos:[],      // дела дня: {id,text,date,done}
    periods:[],    // {id,name,from,to,color}
    birthdays:[],  // {id,name,date:"MM-DD"}
    days:{},       // iso -> {blocks:[{id,start,end,title,sphereId,projectId,tasks:[{text,done}],note}]}
    nextId:1
  };
}
function load(){ try{ const r=localStorage.getItem(LS); return r?JSON.parse(r):null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }
let S = load() || seed();
if(!S.projects) S.projects=[];
if(!S.rituals) S.rituals=[
  { id:"morning", name:"Утренний ритуал", time:"07:30", dur:30,
    steps:["Стакан воды","Молитва и благодарность","Ревизия планов на день","Душ и гигиена","Порядок в комнате"], log:{} },
  { id:"evening", name:"Вечерний ритуал", time:"22:30", dur:30,
    steps:["Запись событий дня","Вещи и план на завтра","Душ","Молитва","Будильник и спать"], log:{} }
];
function ritual(id){ return S.rituals.find(r=>r.id===id); }
if(!S.habits) S.habits=[];
if(!S.weeks) S.weeks={};
if(!S.repeats) S.repeats=[];
if(!S.periods) S.periods=[];
if(!S.floats) S.floats=[]; // legacy
if(!S.todos){ S.todos=[]; (S.floats||[]).forEach(f=>S.todos.push({id:f.id,text:f.text,date:todayISO(),done:false})); }
if(!S.birthdays) S.birthdays=[];
const DAYKINDS=[
  {id:"work",icon:"💼",name:"Рабочий"},
  {id:"rest",icon:"🌿",name:"Выходной"},
  {id:"faith",icon:"⛪",name:"Храм"},
  {id:"exam",icon:"🎯",name:"Экзамен"},
  {id:"trip",icon:"✈️",name:"Поездка"}
];
function dayKind(id){ return DAYKINDS.find(k=>k.id===id); }
function periodOf(t){ return S.periods.find(pp=>t>=pp.from&&t<=pp.to); }
function bdaysOf(t){ return S.birthdays.filter(b=>b.date===t.slice(5)); }
function nextBday(b){
  const T=todayISO(), y=Number(T.slice(0,4));
  let d=y+"-"+b.date;
  if(d<T) d=(y+1)+"-"+b.date;
  return d;
}
function repeatOf(id){ return S.repeats.find(r=>r.id===id); }
function dayBlocksAll(t){
  const real=day(t).blocks;
  const dw=dowIdx(t);
  const virt=S.repeats.filter(r=>
    r.dows.includes(dw) && t>=(r.from||t) && !(r.skip&&r.skip[t]) &&
    !real.some(b=>b.repId===r.id)
  ).map(r=>({virt:true,repId:r.id,start:r.start,end:r.end,title:r.title,
    sphereId:r.sphereId,projectId:r.projectId,color:r.color||null,tasks:[],note:""}));
  return real.concat(virt);
}
function materializeRep(repId,t){
  const r=repeatOf(repId); if(!r) return null;
  const b={id:S.nextId++,start:r.start,end:r.end,title:r.title,sphereId:r.sphereId,
    projectId:r.projectId,color:r.color||null,tasks:[],note:"",repId:r.id};
  day(t).blocks.push(b); save();
  return b;
}
function habit(id){ return S.habits.find(x=>x.id===id); }

let ui={ viewDate:todayISO(), scale:"day", editId:null, addStart:null, pickSphere:null, pickProject:null };

function day(i){ if(!S.days[i]) S.days[i]={blocks:[]}; return S.days[i]; }
function sphere(id){ return S.spheres.find(s=>s.id===id); }
const SPHERE_HEX={"var(--sp-earn)":"#e0a53c","var(--sp-study)":"#5f9df2","var(--sp-body)":"#4bb87d","var(--sp-faith)":"#b592ea"};
function sphereHex(sp){ return SPHERE_HEX[sp.color]||sp.color||"#78828f"; }
function project(id){ return S.projects.find(p=>p.id===id); }
function dleft(p){
  if(!p.deadline) return null;
  const ms=new Date(p.deadline+"T12:00")-new Date(todayISO()+"T12:00");
  return Math.round(ms/86400000);
}
function allocHours(pid,deadline){
  let mins=0; const T=todayISO();
  for(const k in S.days){
    if(k<T) continue;
    if(deadline && k>deadline) continue;
    S.days[k].blocks.forEach(b=>{ if(b.projectId===pid) mins+=t2m(b.end)-t2m(b.start); });
  }
  return mins/60;
}
function fmtH(h){ return (Math.round(h*10)/10).toFixed(1).replace(".0",""); }
function dleftText(d){
  if(d===null) return "";
  if(d<0) return `<span class="over">просрочен ${-d} дн</span>`;
  if(d===0) return `<span class="warn">дедлайн сегодня</span>`;
  if(d===1) return `<span class="warn">завтра</span>`;
  if(d<=7) return `<span class="warn">${d} дн</span>`;
  return d+" дн";
}

function layoutBlocks(blocks){
  // кластеры пересечений -> колонки
  const bs=blocks.map((b,i)=>({i,s:t2m(b.start),e:t2m(b.end)})).sort((a,b)=>a.s-b.s||a.e-b.e);
  const cols={}; // idx->{col,ncols}
  let cluster=[], clusterEnd=-1;
  function flush(){
    if(!cluster.length) return;
    const lanes=[];
    cluster.forEach(x=>{
      let li=lanes.findIndex(le=>le<=x.s);
      if(li===-1){ li=lanes.length; lanes.push(x.e); } else lanes[li]=x.e;
      x.col=li;
    });
    cluster.forEach(x=>{ cols[x.i]={col:x.col,n:lanes.length}; });
    cluster=[]; clusterEnd=-1;
  }
  bs.forEach(x=>{
    if(x.s>=clusterEnd && cluster.length) flush();
    cluster.push(x); clusterEnd=Math.max(clusterEnd,x.e);
  });
  flush();
  return cols;
}

let drag=null;
const wrapEl=document.getElementById("axiswrap");
wrapEl.addEventListener("pointerdown",e=>{
  const el=e.target.closest(".blk");
  if(!el) return;
  if(el.dataset.vrep){

    // продолжаем как с обычным блоком
  }
  if(el.dataset.rid){
    const r=ritual(el.dataset.rid); if(!r) return;
    const isResize=e.target.closest(".rz");
    drag={rid:r.id, r, el, mode:isResize?"resize":"move", startY:e.clientY,
      oS:t2m(r.time), oE:t2m(r.time)+r.dur, active:false, moved:false, curS:null, curE:null, t:null};
    const isMouse=e.pointerType==="mouse";
    if(isResize||isMouse){ activateDrag(); }
    else drag.t=setTimeout(()=>{ if(drag) activateDrag(); },270);
    return;
  }
  const id=Number(el.dataset.id);
  const b=day(ui.viewDate).blocks.find(x=>x.id===id); if(!b) return;
  const isResize=e.target.closest(".rz");
  drag={id,b,el,mode:isResize?"resize":"move",startY:e.clientY,
    oS:t2m(b.start),oE:t2m(b.end),active:false,moved:false,curS:null,curE:null,t:null};
  const isMouse=e.pointerType==="mouse";
  if(isResize||isMouse){ activateDrag(); }
  else drag.t=setTimeout(()=>{ if(drag) activateDrag(); },270);
});
function activateDrag(){ if(!drag) return; drag.active=true; drag.el.classList.add("lifting"); }
document.addEventListener("pointermove",e=>{
  if(!drag) return;
  const dy=e.clientY-drag.startY;
  if(!drag.active){
    if(Math.abs(dy)>9){ clearTimeout(drag.t); drag=null; }
    return;
  }
  drag.moved=drag.moved||Math.abs(dy)>3;
  const startY=yOfMin(drag.oS);
  const rawMin=minOfY(startY+dy);
  const dm=Math.round((rawMin-drag.oS)/15)*15;
  let s=drag.oS, en=drag.oE;
  if(drag.mode==="move"){
    const len=drag.oE-drag.oS;
    s+=dm; en+=dm;
    if(s<H0*60){s=H0*60;en=s+len}
    if(en>H1*60){en=H1*60;s=en-len}
  } else {
    en=Math.max(drag.oS+15, Math.min(H1*60, drag.oE+dm));
  }
  drag.curS=s; drag.curE=en;
  drag.el.style.top=yOfMin(s)+"px";
  drag.el.style.height=Math.max(yOfMin(en)-yOfMin(s)-3,20)+"px";
  const bt=drag.el.querySelector(".btime");
  if(bt) bt.textContent=m2t(s)+"–"+m2t(en);
});
document.addEventListener("pointerup",()=>{
  if(!drag) return;
  clearTimeout(drag.t);
  const d=drag; drag=null;
  d.el.classList.remove("lifting");
  if(d.active&&d.moved&&d.curS!==null){
    if(d.rid){
      if(d.mode==="resize") d.r.dur=Math.max(10,d.curE-d.oS);
      else d.r.time=m2t(d.curS);
    }
    else { d.b.start=m2t(d.curS); d.b.end=m2t(d.curE); }
    save(); render();
  } else if(!d.moved){
    if(d.rid) openRitual(d.rid);
    else openBlock(d.id);
  } else render();
});
document.addEventListener("pointercancel",()=>{
  if(!drag) return; clearTimeout(drag.t);
  drag.el.classList.remove("lifting"); drag=null; render();
});

const WZONES=[[0,6,9],[6,24,52]];
function wYOfMin(mins){
  let y=0;
  for(const [a,b,px] of WZONES){
    const lo=a*60, hi=b*60;
    if(mins<=lo) break;
    y+=(Math.min(mins,hi)-lo)/60*px;
    if(mins<=hi) break;
  }
  return y;
}
function wMinOfY(y){
  let acc=0;
  for(const [a,b,px] of WZONES){
    const zoneH=(b-a)*px;
    if(y<=acc+zoneH) return a*60+(y-acc)/px*60;
    acc+=zoneH;
  }
  return H1*60;
}
const WK_H=(()=>{let t=0;for(const [a,b,px] of WZONES)t+=(b-a)*px;return t;})();

function isoWeekNum(di){

function buildFeedWeeks(startMon,count,T){
  let h="";
  for(let w=0;w<count;w++){
    const wk=addDays(startMon,w*7);
    const days=[]; for(let i=0;i<7;i++) days.push(addDays(wk,i));
    const firstOf=days.find(d=>d.slice(8)==="01");
    if(firstOf){
      const dt=new Date(firstOf+"T12:00");
      const curm=firstOf.slice(0,7)===T.slice(0,7);
      h+=`<div class="mofh ${curm?"curm":""}" data-mon="${firstOf.slice(0,7)}">${MFULL[dt.getMonth()]}${dt.getMonth()===0?`<span class="mfy">${dt.getFullYear()}</span>`:""}</div>`;
    }
    const hasToday=days.includes(T);
    h+=`<div class="morow ${hasToday?"cur":""}"><span class="wnum">${isoWeekNum(days[0])}</span><div class="mogrid7">`;
    days.forEach(di=>{ h+=moCell(di,Number(di.slice(8)),false,T); });
    h+=`</div></div>`;
  }
  return h;
}

      return `<div class="peekrow" ${b.virt?`data-vrep="${b.repId}"`:`data-bid="${b.id}"`} style="--sc:${b.color||(sp?sp.color:"var(--sp-none)")};cursor:pointer">

    });
  });
}

function taskRowHTML(x,k){

  </div>`;
}
function curBlock(){ return day(ui.editDate||ui.viewDate).blocks.find(x=>x.id===ui.editId); }
function addTaskToBlock(){
  const b=curBlock(); if(!b) return;
  const f=document.getElementById("eb-newtask");
  const t=(f.value||"").trim(); if(!t) return;
  b.tasks.push({text:t,done:false}); f.value=""; save();
  const list=document.getElementById("eb-tasks");
  list.insertAdjacentHTML("beforeend",taskRowHTML(b.tasks[b.tasks.length-1],b.tasks.length-1));
  f.focus();
}
function taskListClick(e){
  const row=e.target.closest(".titem"); if(!row) return;
  const k=Number(row.dataset.k); const b=curBlock(); if(!b||!b.tasks[k]) return;
  const act=e.target.dataset.act;
  if(act==="chk"){
    b.tasks[k].done=!b.tasks[k].done; save();
    e.target.classList.toggle("on",b.tasks[k].done);
    e.target.textContent=b.tasks[k].done?"✓":"";
    row.querySelector(".ttx").classList.toggle("don",b.tasks[k].done);
  }
  if(act==="del"){
    b.tasks.splice(k,1); save();
    document.getElementById("eb-tasks").innerHTML=b.tasks.map((x,i)=>taskRowHTML(x,i)).join("");
  }
}

/* ---------- метрики-карман ---------- */
function rangeSummary(from,to){
  let hours=0, used={}, tn=0, td=0, hd=0, rd=0, closedN=0, days=0, moods=[], notes=[];
  for(let t=from;t<=to;t=addDays(t,1)){
    days++;
    dayBlocksAll(t).forEach(b=>{
      const bm=t2m(b.end)-t2m(b.start); hours+=bm/60;
      if(b.sphereId) used[b.sphereId]=(used[b.sphereId]||0)+bm;
      (b.tasks||[]).forEach(x=>{ tn++; if(x.done) td++; });
    });
    S.habits.forEach(hb=>{ if(hb.log[t]) hd++; });
    S.rituals.forEach(r=>{ if(r.log[t]) rd++; });
    const cl=S.days[t]&&S.days[t].closed;
    if(cl){ closedN++; if(cl.mood) moods.push(cl.mood);
      if(cl.note) notes.push({t,mood:cl.mood,note:cl.note}); }
    if(days>400) break;
  }
  return {hours,used,tn,td,hd,hcap:S.habits.length*days,rd,rcap:S.rituals.length*days,
    closedN,days,moods,notes};
}

        <div style="font-size:13.5px;margin-top:2px">${esc(nn.note)}</div></div>`;
    });
  }
  return h;
}

/* ---------- поиск ---------- */
function doSearch(q){
  q=q.trim().toLowerCase();
  if(q.length<2) return [];
  const res=[];
  const dayKeys=Object.keys(S.days).sort().reverse();
  for(const t of dayKeys){
    for(const b of S.days[t].blocks){
      const inTitle=b.title.toLowerCase().includes(q);
      const inNote=(b.note||"").toLowerCase().includes(q);
      const inTask=(b.tasks||[]).some(x=>x.text.toLowerCase().includes(q));
      if(inTitle||inNote||inTask) res.push({type:"block",t,b});
      if(res.length>=30) return res;
    }
  }
  S.projects.forEach(p=>{
    if(p.name.toLowerCase().includes(q)||(p.items||[]).some(i=>i.text.toLowerCase().includes(q)))
      res.push({type:"proj",p});
  });
  S.todos.forEach(f=>{ if(!f.done&&f.text.toLowerCase().includes(q)) res.push({type:"float",f}); });
  return res.slice(0,30);
}

/* ---------- закрытие недели ---------- */
function weekSummary(mon){
  const used={}; let mins=0, tn=0, td=0, hd=0;
  for(let i=0;i<7;i++){
    const di=addDays(mon,i);
    dayBlocksAll(di).forEach(b=>{ const bm=t2m(b.end)-t2m(b.start); mins+=bm;
      if(b.sphereId) used[b.sphereId]=(used[b.sphereId]||0)+bm;
      (b.tasks||[]).forEach(x=>{ tn++; if(x.done) td++; }); });
    S.habits.forEach(hb=>{ if(hb.log[di]) hd++; });
  }
  return {used, hours:mins/60, tn, td, hd, hcap:S.habits.length*7};
}

  // разбивка по сферам с долями
  const totalSph=Object.values(sm.used).reduce((a,b)=>a+b,0)||1;
  const spheresBars=Object.entries(sm.used).sort((a,b)=>b[1]-a[1]).map(([id,m])=>{
    const sp=sphere(id); if(!sp) return "";
    const pct=Math.round(m/totalSph*100);
    return `<div style="margin-bottom:7px">

        <span style="color:var(--dim);font-variant-numeric:tabular-nums">${fmtH(m/60)} ч · ${pct}%</span></div>
      <div style="height:5px;border-radius:3px;background:var(--s2);overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${sp.color};border-radius:3px"></div></div>
    </div>`;
  }).join("");
  // по дням: часы + настроение из закрытий + закрыт ли
  let dayGrid="";
  for(let i=0;i<7;i++){
    const di=addDays(mon,i);
    let mins=0; dayBlocksAll(di).forEach(b=>mins+=t2m(b.end)-t2m(b.start));
    const cl=S.days[di]&&S.days[di].closed;
    const hh=mins/60;
    dayGrid+=`<div style="flex:1;text-align:center">
      <div style="font-size:10px;color:var(--faint);text-transform:uppercase">${DOWS[i]}</div>
      <div style="height:44px;display:flex;align-items:flex-end;justify-content:center;margin:3px 0">
        <div style="width:60%;border-radius:3px 3px 0 0;background:${di===todayISO()?"var(--acc)":"var(--line2)"};height:${Math.max(4,Math.min(44,hh/12*44))}px"></div>
      </div>
      <div style="font-size:13px">${cl&&cl.mood?MOODS[cl.mood-1]:"·"}</div>
    </div>`;
  }
  // дела дня за неделю
  let tdN=0, tdD=0;
  for(let i=0;i<7;i++){ const di=addDays(mon,i);
    S.todos.filter(x=>x.date===di).forEach(x=>{ tdN++; if(x.done) tdD++; }); }
  // проекты: движение
  const projLines=S.projects.filter(p=>!p.finished).map(p=>{
    const al=allocHours(p.id,p.deadline);
    const d=dleft(p);
    const items=p.items||[], done=items.filter(x=>x.done).length;
    return `<div class="sumchip" style="display:block;margin-bottom:5px">${esc(p.icon)} ${esc(p.name)} — ${d!==null?dleftText(d):"—"} · состав <b>${done}/${items.length}</b> · заложено <b>${fmtH(al)} ч</b></div>`;
  }).join("");
  const nearDl=S.projects.filter(pp=>!pp.finished&&pp.deadline&&pp.deadline<=addDays(mon,14)&&pp.deadline>=mon)
    .map(pp=>`<span class="sumchip">${esc(pp.icon)} ${esc(pp.name)} <b>${dleftText(dleft(pp))}</b></span>`).join("");
  // сравнение с прошлой неделей
  const prevSm=weekSummary(prevMon);
  const dH=sm.hours-prevSm.hours;
  const trend=Math.abs(dH)<0.5?"":(dH>0?`↑ на ${fmtH(dH)} ч больше прошлой`:`↓ на ${fmtH(-dH)} ч меньше прошлой`);

  openSheet(`
    <div class="grip"></div>
    <div style="font-size:17px;font-weight:700">Обзор недели</div>
    <div style="font-size:12.5px;color:var(--dim);margin-top:2px">${human(mon)} — ${human(addDays(mon,6))}</div>

    <label>Ритм недели · часы и настроение по дням</label>
    <div style="display:flex;gap:3px;margin-top:4px">${dayGrid}</div>

    <label>Куда ушло время</label>
    ${spheresBars||`<div style="font-size:13px;color:var(--faint)">Блоков со сферами не было</div>`}
    ${trend?`<div style="font-size:12px;color:var(--dim);margin-top:2px">${trend}</div>`:""}

    <label>Сделано</label>
    <div class="sumrow">
      <span class="sumchip">на оси <b>${fmtH(sm.hours)} ч</b></span>
      ${sm.tn?`<span class="sumchip">дела в блоках <b>${sm.td}/${sm.tn}</b></span>`:""}
      ${tdN?`<span class="sumchip">дела дня <b>${tdD}/${tdN}</b></span>`:""}
      ${sm.hcap?`<span class="sumchip">привычки <b>${sm.hd}/${sm.hcap}</b></span>`:""}
      <span class="sumchip">ритуалы <b>${sm.rd??0}/${sm.rcap||0}</b></span>
    </div>

    ${projLines?`<label>Проекты · движение</label>${projLines}`:""}
    ${nearDl?`<label>Дедлайны на горизонте двух недель</label><div class="sumrow">${nearDl}</div>`:""}

    ${prevWk&&prevWk.intent?`<label>Намерение было</label>
      <div style="font-size:13.5px;padding:9px 12px;background:var(--acc-soft);border-radius:11px;color:var(--acc)">→ ${esc(prevWk.intent)}</div>
      <div style="font-size:12px;color:var(--faint);margin-top:5px">Сбылось? Ответь себе честно, прежде чем ставить новое.</div>`:""}

    <label>Что было на самом деле</label>
    <textarea id="cw-note" placeholder="не отчёт, а правда: где силы, где утекло, что понял" style="min-height:80px">${esc(wk.note||"")}</textarea>
    <label>Намерение на следующую</label>
    <textarea id="cw-intent" placeholder="одно главное, что должно стать правдой">${esc(wk.intent||"")}</textarea>
    <button class="btn primary wide" id="cw-save" style="margin-top:18px">${S.weeks[mon]?"Обновить обзор":"Закрыть неделю"}</button>`);
  document.getElementById("cw-save").addEventListener("click",()=>{
    S.weeks[mon]={note:(document.getElementById("cw-note").value||"").trim(),
      intent:(document.getElementById("cw-intent").value||"").trim()};
    closeSheet(); render();
  });
}

/* ---------- ритуал: контейнер с шагами ---------- */
function openRitual(rid,dateISO){
  const r=ritual(rid); if(!r) return;
  const t=dateISO||ui.viewDate;
  const done=!!r.log[t];
  openSheet(`
    <div class="grip"></div>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="width:11px;height:11px;border-radius:50%;background:var(--acc);flex-shrink:0"></span>
      <div style="font-size:17px;font-weight:650;flex:1">${esc(r.name)}</div>
      ${done?`<span style="font-size:12.5px;color:var(--acc);font-weight:650">прожит ✓</span>`:""}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px">
      <div><label style="margin-top:0">Начало</label>
        <input type="time" id="rt-time" value="${r.time}"></div>
      <div><label style="margin-top:0">Минут</label>
        <input type="text" id="rt-dur" inputmode="numeric" value="${r.dur}"></div>
    </div>
    <label>Шаги</label>
    <div class="tlist">${r.steps.map((st,i)=>`
      <div class="titem"><span style="width:20px;color:var(--faint);font-size:12.5px;font-variant-numeric:tabular-nums;flex-shrink:0">${i+1}</span>
      <div class="ttx">${esc(st)}</div></div>`).join("")}</div>
    <span style="display:inline-block;margin-top:8px;font-size:12.5px;color:var(--acc);cursor:pointer" id="rt-edit">изменить шаги</span>
    <div id="rt-editor" style="display:none">
      <textarea id="rt-steps" style="min-height:120px;margin-top:8px">${r.steps.map(esc).join("\n")}</textarea>
    </div>
    <div style="display:flex;gap:10px;margin-top:18px">
      ${done?`<button class="btn" style="flex:1" id="rt-undo">Снять отметку</button>`:
        `<button class="btn primary" style="flex:1" id="rt-done">Прожит</button>`}
      <button class="btn" id="rt-save">Сохранить</button>
    </div>`);
  document.getElementById("rt-edit").addEventListener("click",()=>{
    const ed=document.getElementById("rt-editor");
    ed.style.display=ed.style.display==="none"?"":"none";
  });
  const fin=()=>{ 
    r.time=document.getElementById("rt-time").value||r.time;
    r.dur=Math.max(10,parseInt(document.getElementById("rt-dur").value)||r.dur);
    const ta=document.getElementById("rt-steps");
    if(ta){ const lines=ta.value.split("\n").map(l=>l.trim()).filter(Boolean);
      if(lines.length) r.steps=lines; }
  };
  document.getElementById("rt-save").addEventListener("click",()=>{ fin(); closeSheet(); render(); });
  const bd=document.getElementById("rt-done");
  if(bd) bd.addEventListener("click",()=>{ fin(); r.log[t]=true; closeSheet(); render(); });
  const bu=document.getElementById("rt-undo");
  if(bu) bu.addEventListener("click",()=>{ delete r.log[t]; closeSheet(); render(); });
}

/* ---------- аллокация: заложить время из проекта ---------- */
function openAlloc(pid){
  const p=project(pid); if(!p) return;
  ui.allocDate=ui.viewDate>=todayISO()?ui.viewDate:todayISO();
  ui.allocDur=60;
  renderAllocSheet(p);
}
function renderAllocSheet(p){
  const sp=sphere(p.sphereId);
  const al=allocHours(p.id,p.deadline);
  const d=dleft(p);
  // полоса ближайших 7 дней от сегодня
  const T=todayISO();
  let daysRow="";
  for(let i=0;i<7;i++){
    const di=addDays(T,i);
    const over=p.deadline&&di>p.deadline;
    daysRow+=`<div class="dcell ${di===ui.allocDate?"sel":""} ${di===T?"now":""}"
      data-ad="${di}" style="${over?"opacity:.35":""}">
      <div class="dl">${DOWS[dowIdx(di)]}</div><div class="dn">${new Date(di+"T12:00").getDate()}</div></div>`;
  }
  openSheet(`
    <div class="grip"></div>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:17px">${esc(p.icon||"◆")}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:15.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</div>
        <div style="font-size:12px;color:var(--dim)">${[d!==null?dleftText(d):"",al?`заложено ${fmtH(al)} ч`:""].filter(Boolean).join(" · ")||"без дедлайна"}</div>
      </div>
    </div>
    <label>День</label>
    <div style="display:flex;gap:4px" id="al-days">${daysRow}</div>
    <label>Начало</label>
    <input type="time" id="al-start" value="09:00">
    <label>Длительность</label>
    <div style="display:flex;gap:8px" id="al-dur">
      ${[30,60,90,120,180].map(m=>`<button class="btn sm" data-dur="${m}" style="flex:1;${ui.allocDur===m?"box-shadow:inset 0 0 0 2px var(--acc)":""}">${m<60?m+"м":fmtH(m/60)+"ч"}</button>`).join("")}
    </div>
    <button class="btn primary wide" id="al-put" style="margin-top:18px">Положить на ось</button>
    <div style="text-align:center;margin-top:10px;font-size:12px;color:var(--faint)" id="al-note"></div>`);
  bindAlloc(p);
}
function bindAlloc(p){
  document.querySelectorAll("#al-days .dcell").forEach(el=>{
    el.addEventListener("click",()=>{
      ui.allocDate=el.dataset.ad;
      document.querySelectorAll("#al-days .dcell").forEach(x=>x.classList.toggle("sel",x.dataset.ad===ui.allocDate));
    });
  });
  document.querySelectorAll("#al-dur [data-dur]").forEach(b=>{
    b.addEventListener("click",()=>{
      ui.allocDur=Number(b.dataset.dur);
      document.querySelectorAll("#al-dur [data-dur]").forEach(x=>
        x.style.boxShadow=Number(x.dataset.dur)===ui.allocDur?"inset 0 0 0 2px var(--acc)":"");
    });
  });
  document.getElementById("al-put").addEventListener("click",()=>{
    const st=document.getElementById("al-start").value||"09:00";
    let en=t2m(st)+ui.allocDur; if(en>H1*60) en=H1*60;
    day(ui.allocDate).blocks.push({id:S.nextId++,start:st,end:m2t(en),title:p.name,
      sphereId:p.sphereId,projectId:p.id,tasks:[],note:""});
    save();
    const al=allocHours(p.id,p.deadline);
    const note=document.getElementById("al-note");
    if(note) note.textContent="✓ Положено · всего заложено "+fmtH(al)+" ч. Можно продолжать.";
    // мягко обновить сводку в шапке шторки не перерисовывая (следующее открытие покажет)
  });
}

/* ---------- настройки ---------- */
document.getElementById("btn-settings").addEventListener("click",()=>{
  openSheet(`
    <div class="grip"></div>
    <div style="font-size:17px;font-weight:650;margin-bottom:2px">Настройки</div>
    <label>Имя</label>
    <input type="text" id="st-name" value="${esc(S.settings.name||"")}">
    <label>Тема</label>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn" id="th-d" style="flex:1;${(S.settings.theme||"dark")==="dark"?"box-shadow:inset 0 0 0 2px var(--acc)":""}">Тёмная</button>
      <button class="btn" id="th-l" style="flex:1;${S.settings.theme==="light"?"box-shadow:inset 0 0 0 2px var(--acc)":""}">Светлая</button>
    </div>
    <label>Акцент</label>
    <div style="display:flex;gap:10px;margin-top:6px" id="st-acc">
      ${[["green","#59a877"],["gold","#d0973f"],["blue","#5c90da"],["wine","#b75c6f"]].map(([k,c])=>`
        <button class="btn accbtn" data-a="${k}" style="width:40px;height:40px;border-radius:50%;background:${c};padding:0;border:none;
          ${(S.settings.accent||"green")===k?"box-shadow:0 0 0 3px var(--bg),0 0 0 5px "+c:""}"></button>`).join("")}
    </div>
    <label>Сферы жизни</label>
    <div id="st-spheres">${S.spheres.map(sp=>`
      <div style="display:flex;gap:9px;align-items:center;margin-bottom:8px" data-sp="${sp.id}">
        <input type="color" class="sp-col" value="${sphereHex(sp)}" style="width:34px;height:34px;border:none;border-radius:50%;padding:0;background:none;cursor:pointer;flex-shrink:0">
        <input type="text" class="sp-name" value="${esc(sp.name)}" style="flex:1">
        ${S.spheres.length>2?`<span class="tdel" data-act="delsp">✕</span>`:""}
      </div>`).join("")}</div>
    <button class="btn sm" id="sp-add" style="margin-top:2px">+ сфера</button>
    <label>Данные</label>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn" style="flex:1" id="st-export">Экспорт</button>
      <button class="btn" style="flex:1" id="st-import">Импорт</button>
      <input type="file" id="st-file" accept=".json" style="display:none">
    </div>
    <div style="font-size:11.5px;color:var(--faint);margin-top:6px">Экспорт скачивает полную копию. Держи её свежей до появления облачного синка.</div>
    <button class="btn primary wide" id="st-save" style="margin-top:18px">Сохранить</button>
    <div style="text-align:center;margin-top:14px;font-size:12px;color:var(--faint)">Календарь-ОС</div>`);
  document.getElementById("th-d").addEventListener("click",()=>{S.settings.theme="dark";applyTheme();save();refreshThemeBtns();});
  document.getElementById("th-l").addEventListener("click",()=>{S.settings.theme="light";applyTheme();save();refreshThemeBtns();});
  document.querySelectorAll(".accbtn").forEach(b=>{
    b.addEventListener("click",()=>{
      S.settings.accent=b.dataset.a; applyTheme(); save();
      const cols={green:"#59a877",gold:"#d0973f",blue:"#5c90da",wine:"#b75c6f"};
      document.querySelectorAll(".accbtn").forEach(x=>{
        x.style.boxShadow = x.dataset.a===S.settings.accent ? "0 0 0 3px var(--bg),0 0 0 5px "+cols[x.dataset.a] : "";
      });
    });
  });
  function refreshThemeBtns(){
    document.getElementById("th-d").style.boxShadow=S.settings.theme==="dark"?"inset 0 0 0 2px var(--acc)":"";
    document.getElementById("th-l").style.boxShadow=S.settings.theme==="light"?"inset 0 0 0 2px var(--acc)":"";
  }
  document.getElementById("sp-add").addEventListener("click",()=>{
    const id="sp"+(S.nextId++);
    S.spheres.push({id,name:"Новая сфера",color:"#8f7ff0"}); save();
    const host=document.getElementById("st-spheres");
    host.insertAdjacentHTML("beforeend",`
      <div style="display:flex;gap:9px;align-items:center;margin-bottom:8px" data-sp="${id}">
        <input type="color" class="sp-col" value="#8f7ff0" style="width:34px;height:34px;border:none;border-radius:50%;padding:0;background:none;cursor:pointer;flex-shrink:0">
        <input type="text" class="sp-name" value="Новая сфера" style="flex:1">
        <span class="tdel" data-act="delsp">✕</span>
      </div>`);
  });
  document.getElementById("st-spheres").addEventListener("click",e=>{
    if(e.target.dataset.act!=="delsp") return;
    const row=e.target.closest("[data-sp]"); if(!row) return;
    const id=row.dataset.sp;
    if(S.spheres.length<=2) return;
    S.spheres=S.spheres.filter(x=>x.id!==id);
    for(const k in S.days) S.days[k].blocks.forEach(b=>{ if(b.sphereId===id) b.sphereId=null; });
    S.repeats.forEach(r=>{ if(r.sphereId===id) r.sphereId=null; });
    S.projects.forEach(pp=>{ if(pp.sphereId===id) pp.sphereId=null; });
    save(); row.remove();
  });
  document.getElementById("st-export").addEventListener("click",()=>{
    const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="calendar-os-"+todayISO()+".json";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  });
  document.getElementById("st-import").addEventListener("click",()=>{
    document.getElementById("st-file").click();
  });
  document.getElementById("st-file").addEventListener("change",e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const data=JSON.parse(rd.result);
        if(!data||!data.days||!data.spheres) throw new Error("bad");
        S=data; save(); applyTheme(); closeSheet(); render();
      }catch(err){
        const note=document.createElement("div");
        note.style.cssText="color:#c05a50;font-size:12.5px;margin-top:8px";
        note.textContent="Файл не похож на копию Календаря-ОС";
        document.getElementById("st-file").parentElement.appendChild(note);
      }
    };
    rd.readAsText(f);
  });
  document.getElementById("st-save").addEventListener("click",()=>{
    S.settings.name=(document.getElementById("st-name").value||"").trim();
    document.querySelectorAll("#st-spheres [data-sp]").forEach(row=>{
      const sp=sphere(row.dataset.sp); if(!sp) return;
      const nm=row.querySelector(".sp-name"), cl=row.querySelector(".sp-col");
      if(nm&&nm.value.trim()) sp.name=nm.value.trim();
      if(cl&&cl.value) sp.color=cl.value;
    });
    closeSheet(); render();
  });
});

/* ---------- навигация по дням ---------- */
function scrollFeedTo(mon){
  const t=document.querySelector(`.mofh[data-mon="${mon}"]`);
  const sc2=document.getElementById("scroll");
  if(t){ sc2.scrollTo({top:Math.max(0,t.offsetTop-6),behavior:"smooth"}); renderHead(); }
  else { ui.feedStart=null; render(); }
}
function shiftMonth(n){
  let [Y,M]=(ui.monthAnchor||ui.viewDate.slice(0,7)).split("-").map(Number);
  M+=n; if(M<1){M=12;Y--} if(M>12){M=1;Y++}
  ui.monthAnchor=Y+"-"+String(M).padStart(2,"0");
}
/* стрелки убраны: свайп и dowbar/лента ведут навигацию */
document.getElementById("btn-today").addEventListener("click",()=>{
  ui.viewDate=todayISO(); ui.calMonth=ui.viewDate.slice(0,7); ui.monthAnchor=ui.viewDate.slice(0,7);
  ui.yearAnchor=Number(ui.viewDate.slice(0,4));
  if(ui.scale==="month") ui.feedStart=null;
  render(); if(ui.scale==="day") scrollToNow();
});

let sx=null, sy=null;
const sc=document.getElementById("scroll");
sc.addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
sc.addEventListener("touchend",e=>{
  if(sx===null) return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
  if(Math.abs(dx)>64 && Math.abs(dx)>Math.abs(dy)*1.7){
    const fwd=dx<0;
    if(ui.scale==="day"){ ui.viewDate=addDays(ui.viewDate,fwd?1:-1); ui.calMonth=ui.viewDate.slice(0,7); render(); }
    else if(ui.scale==="week"){ ui.viewDate=addDays(ui.viewDate,fwd?7:-7); ui.calMonth=ui.viewDate.slice(0,7); render(); }
    else if(ui.scale==="year"){ ui.yearAnchor=(ui.yearAnchor||new Date().getFullYear())+(fwd?1:-1); render(); }
  }
},{passive:true});

function scrollToNow(){
  const now=new Date(); const mins=now.getHours()*60+now.getMinutes();
  const y=Math.max(0,yOfMin(mins) - sc.clientHeight*0.35);
  sc.scrollTo({top:y,behavior:"smooth"});
}

/* ---------- старт ---------- */
render();
setTimeout(()=>{
  const now=new Date();
  if(ui.viewDate===todayISO()) scrollToNow();
  else sc.scrollTo({top:yOfMin(7*60),behavior:"auto"});
}, 300);

</script>
